services:
  # Production build served by nginx: `docker compose up --build`
  web:
    build:
      context: .
      target: final
    ports:
      - 8080:8080

  # Vite dev server with hot reload: `docker compose --profile dev up --build dev`
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    ports:
      - 5173:5173
    volumes:
      - .:/app
      # Keep the image's node_modules instead of the host's (or lack of one).
      - /app/node_modules
