name: Docker Image CI
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag container:ci .

      - name: Build the dev image
        run: docker build --target dev --tag container:ci-dev .

      - name: Start the container
        run: docker run --detach --name web --publish 8080:8080 container:ci

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1

      - name: Check the index page and SPA fallback
        run: |
          curl --fail --silent http://localhost:8080/ | grep --quiet '<div id="root">'
          curl --fail --silent http://localhost:8080/some/client/route | grep --quiet '<div id="root">'
